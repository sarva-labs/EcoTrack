[project]
name = "ecotrack-ml"
version = "0.1.0"
description = "ML training, inference, and evaluation engine for EcoTrack"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "torch>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "mlflow>=2.10",
    "onnxruntime>=1.17",
    "timm>=0.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.1+cu121"]
full = ["transformers>=4.37", "lightning>=2.1", "wandb>=0.16"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_ml"]

