[project]
name = "ecotrack-agents"
version = "0.1.0"
description = "Multi-agent coordination system for EcoTrack"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "structlog>=23.1",
]

[project.optional-dependencies]
llm = ["langchain>=0.1", "langgraph>=0.1", "openai>=1.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_agents"]
