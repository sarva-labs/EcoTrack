[project]
name = "ecotrack-rl-policy"
version = "0.1.0"
description = "Reinforcement learning for environmental policy optimization"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.1",
    "structlog>=23.1",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.2"]
dev = ["pytest>=7.4", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_rl"]
