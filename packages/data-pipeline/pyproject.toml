[project]
name = "ecotrack-data-pipeline"
version = "0.1.0"
description = "Data ingestion and ETL pipeline for EcoTrack"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "httpx>=0.27",
    "pystac-client>=0.8",
    "xarray>=2024.1",
    "rasterio>=1.3",
    "netCDF4>=1.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "geopandas>=0.14",
    "aioboto3>=12.0",
    "aiofiles>=23.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "h3>=3.7",
    "tenacity>=8.2",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_data"]
