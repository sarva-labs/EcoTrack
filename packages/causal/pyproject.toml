[project]
name = "ecotrack-causal"
version = "0.1.0"
description = "Causal inference engine for environmental systems"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "structlog>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_causal"]
