[project]
name = "ecotrack-geo"
version = "0.1.0"
description = "Geospatial utilities for EcoTrack"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "h3>=3.7",
    "pyproj>=3.6",
    "mercantile>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_geo"]
