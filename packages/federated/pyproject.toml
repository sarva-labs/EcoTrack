[project]
name = "ecotrack-federated"
version = "0.1.0"
description = "Federated learning for privacy-preserving environmental model training"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "torch>=2.1",
    "numpy>=1.26",
    "structlog>=23.1",
]

[project.optional-dependencies]
flower = ["flwr>=1.7"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_federated"]
