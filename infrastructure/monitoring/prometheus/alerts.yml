groups:
  - name: ecotrack_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(ecotrack_api_requests_total{status_code=~"5.."}[5m]) / rate(ecotrack_api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate (> 5%)"
          
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(ecotrack_api_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95 > 2s)"
      
      - alert: DataIngestionStalled
        expr: rate(ecotrack_data_records_ingested_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No data ingested in the last hour"
      
      - alert: ModelInferenceSlowdown
        expr: histogram_quantile(0.95, rate(ecotrack_ml_inference_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Model inference p95 > 5s"
      
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 2048
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage > 2GB"
