apiVersion: v1
kind: Service
metadata:
  name: api-python
  namespace: ecotrack
  labels:
    app.kubernetes.io/name: api-python
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: api-python