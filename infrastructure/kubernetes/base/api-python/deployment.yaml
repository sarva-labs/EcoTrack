apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-python
  namespace: ecotrack
  labels:
    app.kubernetes.io/name: api-python
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-python
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-python
    spec:
      containers:
      - name: api-python
        image: ghcr.io/ecotrack/api-python:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: log_level
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: db_host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: db_port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: api-python-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-python-secrets
              key: db_password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: redis_host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: redis_port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-python-secrets
              key: redis_password
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: s3_endpoint
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: s3_bucket
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: api-python-secrets
              key: s3_access_key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-python-secrets
              key: s3_secret_key
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: api-python-config
              key: mlflow_tracking_uri
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000