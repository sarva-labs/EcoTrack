[project]
name = "ecotrack"
version = "0.1.0"
description = "AI-for-Earth: Planetary-scale environmental intelligence platform"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
