environment: production
debug: false
log_level: INFO

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins: ["https://www.ecotrack.earth", "https://api.ecotrack.earth"]
  rate_limit:
    free: { rpm: 30, rpd: 1000 }
    researcher: { rpm: 120, rpd: 10000 }
    institutional: { rpm: 600, rpd: 100000 }

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  pool_size: 100
  ssl: true
  extensions:
    - postgis
    - timescaledb
    - pgvector

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  db: 0
  password: ${REDIS_PASSWORD}
  ttl_default_seconds: 300
  cluster_mode: true

kafka:
  bootstrap_servers: ${KAFKA_BROKERS}
  schema_registry_url: ${SCHEMA_REGISTRY_URL}
  consumer_group_prefix: "ecotrack"
  default_partitions: 24
  replication_factor: 3

neo4j:
  uri: ${NEO4J_URI}
  database: ecotrack
  user: ${NEO4J_USER}
  password: ${NEO4J_PASSWORD}

storage:
  endpoint: ${S3_ENDPOINT}
  bucket: ${S3_BUCKET}
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}
  secure: true

mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI}
  artifact_root: ${MLFLOW_ARTIFACT_ROOT}

h3:
  default_resolution: 7
  partition_resolution: 3
  cache_resolution: 5

feature_flags:
  FF_CLIMATE_GRAPHCAST_ENSEMBLE: "on"
  FF_CLIMATE_DOWNSCALING_V2: "off"
  FF_CLIMATE_SCENARIO_EXPLORER: "on"
  FF_AGENTS_ENABLED: "percentage"
  FF_AGENTS_ENABLED_PERCENTAGE: 25.0
  FF_AGENTS_CROSS_DOMAIN: "off"
  FF_PIPELINE_SENTINEL2_REALTIME: "on"
  FF_UI_3D_TERRAIN: "off"