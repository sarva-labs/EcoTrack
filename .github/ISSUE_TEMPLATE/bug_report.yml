name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of EcoTrack are you running?
      placeholder: e.g., v1.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where is this bug occurring?
      options:
        - Development (local)
        - Staging
        - Production
        - Other (please specify)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - API (Python)
        - API (TypeScript)
        - Web Dashboard
        - Worker
        - CLI
        - Infrastructure
        - Data Pipeline
        - ML Models
        - Other (please specify)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: environment-details
    attributes:
      label: Environment details
      description: |
        For local development issues, please provide:
        - OS: [e.g. macOS 14.2, Windows 11, Ubuntu 22.04]
        - Browser (if applicable): [e.g. Chrome 120, Firefox 121]
        - Python version: [e.g. 3.11.7]
        - Node.js version (if applicable): [e.g. 20.10.0]
      placeholder: |
        OS: macOS 14.2
        Browser: Chrome 120
        Python: 3.11.7
        Node.js: 20.10.0
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/ecotrack/ecotrack/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true