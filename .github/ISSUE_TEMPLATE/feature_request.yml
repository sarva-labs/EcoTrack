name: Feature Request
description: Suggest an idea for EcoTrack
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which domain does this feature primarily relate to?
      options:
        - Climate
        - Biodiversity
        - Health
        - Food Security
        - Resource Equity
        - Cross-domain
        - Infrastructure/DevOps
        - User Interface
        - Other (please specify)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this feature affect?
      options:
        - API (Python)
        - API (TypeScript)
        - Web Dashboard
        - Worker
        - CLI
        - Data Pipeline
        - ML Models
        - Knowledge Graph
        - Agent System
        - Infrastructure
        - Other (please specify)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented
      placeholder: I would like to see [...]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: I've also thought about [...]
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request here
  - type: dropdown
    id: priority
    attributes:
      label: Perceived Priority
      description: How important do you think this feature is?
      options:
        - Critical (blocking work)
        - High (important for upcoming work)
        - Medium (would significantly improve experience)
        - Low (nice to have)
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute to this feature?
      options:
        - label: I'm willing to submit a PR for this feature
        - label: I'm willing to test this feature
        - label: I'm willing to document this feature
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our [Code of Conduct](https://github.com/ecotrack/ecotrack/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true