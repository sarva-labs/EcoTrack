[project]
name = "ecotrack-cli"
version = "0.1.0"
description = "Command-line interface for EcoTrack platform management"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "ecotrack-core",
]

[project.scripts]
ecotrack = "ecotrack_cli.main:cli"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_cli"]
