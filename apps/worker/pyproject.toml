[project]
name = "ecotrack-worker"
version = "0.1.0"
description = "Background task worker for EcoTrack data processing and model training"
requires-python = ">=3.11"
dependencies = [
    "ecotrack-core",
    "ecotrack-data-pipeline",
    "ecotrack-ml",
    "celery[redis]>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecotrack_worker"]
